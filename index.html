<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Art of the Prompt — GCSE prompting</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}
/* Microsoft brand palette (requested by user) layered on the Clawpilot theme */
:root {
  --ms-red: #F25022; --ms-green: #7FBA00; --ms-blue: #00A4EF; --ms-yellow: #FFB900;
  --ms-brand-blue: #0078D4; --ms-brand-blue-hover: #106EBE; --ms-on-blue: #ffffff;
  --ms-wordmark: #737373;
  --tl-red: var(--cp-danger); --tl-amber: var(--cp-warning); --tl-green: var(--cp-success);
  --tl-housing: #2b2b2b; --tl-off: #4a4a4a;
}
html[data-theme="dark"] {
  --ms-brand-blue: #4da6ff; --ms-brand-blue-hover: #6cb6ff; --ms-on-blue: #1a1a1a;
  --ms-wordmark: #dedede; --tl-housing: #1a1a1a; --tl-off: #3a3a3a;
}
@property --ang { syntax: "<angle>"; initial-value: 0deg; inherits: false; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--cp-bg); color: var(--cp-text);
  font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 15px; line-height: 1.5;
}
button, select, textarea, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ms-brand-blue); outline-offset: 2px; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; pointer-events: none; }

/* Top bar */
.topbar {
  position: fixed; inset: 0 0 auto 0; height: 60px; z-index: 30;
  display: flex; align-items: center; gap: 14px; padding: 0 20px;
  background: var(--cp-panel-strong); border-bottom: 1px solid var(--cp-border);
}
.brand { display: flex; align-items: center; gap: 9px; flex: none; }
.brand svg { width: 22px; height: 22px; display: block; }
.wordmark { font-weight: 600; font-size: 19px; color: var(--ms-wordmark); letter-spacing: -0.3px; }
.vdiv { width: 1px; height: 26px; background: var(--cp-border); flex: none; }
.title h1 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.2; }
.title p { margin: 0; font-size: 12px; color: var(--cp-text-muted); }
.spacer { flex: 1; }
.field { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--cp-text-muted); }
.select {
  appearance: none; padding: 7px 34px 7px 12px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--cp-border-strong); background: var(--cp-surface); color: var(--cp-text); font-weight: 600;
  background-image: linear-gradient(45deg, transparent 50%, var(--cp-text-muted) 50%), linear-gradient(135deg, var(--cp-text-muted) 50%, transparent 50%);
  background-position: calc(100% - 17px) 52%, calc(100% - 12px) 52%; background-size: 5px 5px; background-repeat: no-repeat;
  max-width: 260px; text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
}
.toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--cp-text-muted); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--ms-brand-blue); width: 16px; height: 16px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--cp-border-strong); background: var(--cp-surface); color: var(--cp-text); font-weight: 600; font-size: 14px;
  transition: transform .15s, background .15s, box-shadow .15s;
}
.btn:hover { background: var(--cp-surface-soft); transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.98); }
.btn.primary { background: var(--ms-brand-blue); color: var(--ms-on-blue); border-color: transparent; }
.btn.primary:hover { background: var(--ms-brand-blue-hover); box-shadow: 0 6px 18px color-mix(in srgb, var(--ms-brand-blue) 40%, transparent); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; font-size: 13px; }

/* Stage & slides */
#stage { position: fixed; top: 60px; bottom: 132px; left: 0; right: 0; z-index: 10; overflow: hidden; }
.slide {
  position: absolute; inset: 0; overflow-y: auto; padding: 22px 32px 36px;
  opacity: 0; visibility: hidden; transform: translateX(60px) scale(.98);
  transition: opacity .5s, transform .6s cubic-bezier(.2,.9,.2,1), visibility 0s .6s;
}
.slide.before { transform: translateX(-60px) scale(.98); }
.slide.active { opacity: 1; visibility: visible; transform: none; transition: opacity .5s, transform .6s cubic-bezier(.2,.9,.2,1); }
.wrap { max-width: 1240px; margin: 0 auto; }
.wrap.fill { height: 100%; }
.shead { display: flex; gap: 20px; align-items: stretch; margin-bottom: 18px; }
.shead .txt {
  flex: 1; padding: 18px 22px; border-radius: 16px; background: var(--cp-panel);
  border: 1px solid var(--cp-border); box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
}
.anchor {
  width: 250px; min-height: 160px; flex: none; border-radius: 16px; position: relative;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--ms-brand-blue) 14%, transparent), transparent);
}
.eyebrow { display: inline-flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ms-brand-blue); }
.eyebrow .ind { padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--ms-brand-blue) 12%, transparent); letter-spacing: .04em; }
h2 { margin: 6px 0 4px; font-size: 28px; line-height: 1.2; font-weight: 700; letter-spacing: -0.4px; }
.lede { margin: 0; color: var(--cp-text-muted); max-width: 70ch; }
.slide.active .pop { animation: popIn .7s cubic-bezier(.2,1.5,.4,1) both; animation-delay: calc(var(--i, 0) * 110ms + 120ms); }
@keyframes popIn { from { opacity: 0; transform: translateY(26px) scale(.92) rotateX(12deg); } to { opacity: 1; transform: none; } }

/* Intro */
.intro { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; padding-bottom: 4vh; }
.intro .anchor { width: min(640px, 90vw); height: 36vh; min-height: 200px; background: radial-gradient(closest-side, color-mix(in srgb, var(--ms-blue) 16%, transparent), transparent); }
.intro h2 { font-size: clamp(40px, 6vw, 72px); letter-spacing: -1.5px; margin: 8px 0; }
.grad-text { background: linear-gradient(90deg, var(--ms-red), var(--ms-yellow) 30%, var(--ms-green) 60%, var(--ms-blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.intro .lede { margin: 0 auto 18px; font-size: 18px; }
.hint { font-size: 13px; color: var(--cp-text-soft); margin-top: 12px; }
kbd { font-family: Consolas, "Courier New", Courier, monospace; font-size: 12px; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--cp-border-strong); background: var(--cp-surface); }

/* GCSE framework */
.gcse { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; perspective: 900px; }
.gcard {
  --c: var(--ms-blue); position: relative; overflow: hidden; padding: 20px; border-radius: 16px;
  background: var(--cp-panel-strong); border: 1px solid var(--cp-border); border-top: 5px solid var(--c);
  box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14); transition: transform .3s, box-shadow .3s;
}
.gcard:hover { transform: translateY(-6px) rotateX(4deg); box-shadow: 0 14px 30px color-mix(in srgb, var(--c) 28%, transparent); }
.gcard .big { font-size: 64px; font-weight: 800; line-height: 1; color: var(--c); }
.gcard h3 { margin: 6px 0 2px; font-size: 20px; }
.gcard .q { font-weight: 600; color: var(--cp-text-muted); margin: 0 0 8px; }
.gcard p { margin: 0; font-size: 14px; }
.gcard .eg { margin-top: 10px; font-size: 13px; color: var(--cp-text-muted); border-left: 3px solid var(--c); padding-left: 8px; }
.formula { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; }
.formula .t { padding: 6px 14px; border-radius: 999px; background: color-mix(in srgb, var(--c) 18%, transparent); border: 2px solid var(--c); }
.formula .eq { padding: 6px 16px; border-radius: 999px; background: var(--ms-brand-blue); color: var(--ms-on-blue); }

/* Scenario cards */
.task { margin-top: 8px; font-size: 14px; color: var(--cp-text); padding: 8px 12px; border-radius: 10px; background: var(--cp-surface-soft); display: inline-block; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; perspective: 1000px; }
.pcard {
  --c: var(--tl-red); display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 16px;
  background: var(--cp-panel-strong); border: 1px solid var(--cp-border); box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
  transition: transform .3s, box-shadow .3s;
}
.pcard:hover { transform: translateY(-4px); box-shadow: 0 16px 34px color-mix(in srgb, var(--c) 25%, transparent); }
.pcard.average { --c: var(--tl-amber); }
.pcard.great {
  --c: var(--tl-green); border: 2px solid transparent;
  background: linear-gradient(var(--cp-surface), var(--cp-surface)) padding-box,
    conic-gradient(from var(--ang), var(--ms-red), var(--ms-green), var(--ms-blue), var(--ms-yellow), var(--ms-red)) border-box;
  animation: spinBorder 6s linear infinite;
}
.slide.active .pcard.great.pop { animation: popIn .7s cubic-bezier(.2,1.5,.4,1) both, spinBorder 6s linear infinite; animation-delay: calc(var(--i, 0) * 110ms + 120ms), 0s; }
@keyframes spinBorder { to { --ang: 360deg; } }
.phead { display: flex; align-items: center; gap: 10px; }
.lamp { width: 16px; height: 16px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent), 0 0 16px var(--c); animation: glow 2.4s ease-in-out infinite; flex: none; }
@keyframes glow { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 18%, transparent), 0 0 26px var(--c); } }
.plabel { font-weight: 700; font-size: 17px; }
.score { margin-left: auto; font-weight: 700; font-size: 13px; padding: 2px 9px; border-radius: 999px; background: color-mix(in srgb, var(--c) 18%, transparent); }
.meter { height: 6px; border-radius: 99px; background: var(--cp-surface-soft); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--c); border-radius: 99px; transition: width 1s cubic-bezier(.2,.9,.2,1) .4s; }
.slide.active .meter i { width: var(--w); }
blockquote { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--cp-surface-soft); border-left: 4px solid var(--c); font-size: 14px; line-height: 1.6; }
.chips { display: flex; gap: 6px; }
.chip { --e: var(--ms-blue); width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 13px; border: 2px solid var(--cp-border); color: var(--cp-text-soft); }
.chip.on { background: var(--e); border-color: var(--e); color: var(--ms-on-blue); }
html[data-theme="dark"] .chip.on { color: var(--cp-accent-fg); }
.chip.half { border-color: var(--e); color: var(--cp-text); border-style: dashed; }
.why { margin: 0; font-size: 13px; color: var(--cp-text-muted); }
.seg { --e: var(--ms-blue); background: color-mix(in srgb, var(--e) 16%, transparent); border-bottom: 2px solid var(--e); border-radius: 3px; padding: 0 2px; transition: background .3s, border-color .3s; }
.seg sup { font-size: 10px; font-weight: 800; color: var(--e); margin-right: 2px; }
body.no-hl .seg { background: none; border-bottom-color: transparent; }
body.no-hl .seg sup { display: none; }
.e-g { --e: var(--ms-red); --c: var(--ms-red); } .e-c { --e: var(--ms-green); --c: var(--ms-green); }
.e-s { --e: var(--ms-blue); --c: var(--ms-blue); } .e-e { --e: var(--ms-yellow); --c: var(--ms-yellow); }

/* Golden rules */
.rules { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.rule { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; background: var(--cp-panel-strong); border: 1px solid var(--cp-border); transition: transform .25s; }
.rule:hover { transform: translateX(6px); }
.rule .n { --c: var(--ms-red); flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; color: var(--ms-on-blue); background: var(--c); box-shadow: 0 6px 16px color-mix(in srgb, var(--c) 40%, transparent); }
html[data-theme="dark"] .rule .n { color: var(--cp-accent-fg); }
.rule h4 { margin: 0 0 2px; font-size: 15px; }
.rule p { margin: 0; font-size: 13px; color: var(--cp-text-muted); }

/* Grader */
.grader { display: grid; grid-template-columns: 1.1fr .9fr; gap: 16px; }
.panel { padding: 18px; border-radius: 16px; background: var(--cp-panel-strong); border: 1px solid var(--cp-border); box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14); }
.panel h3 { margin: 0 0 8px; font-size: 17px; }
textarea {
  width: 100%; min-height: 220px; resize: vertical; padding: 12px 14px; border-radius: 10px; line-height: 1.55;
  border: 1px solid var(--cp-border-strong); background: var(--cp-surface); color: var(--cp-text);
}
textarea:focus { outline: none; border-color: var(--ms-brand-blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ms-brand-blue) 25%, transparent); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.muted { color: var(--cp-text-muted); font-size: 13px; }
.result { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: start; }
.tlight { width: 74px; padding: 10px; border-radius: 18px; background: var(--tl-housing); display: flex; flex-direction: column; gap: 10px; align-items: center; box-shadow: inset 0 2px 6px rgba(0,0,0,0.4); }
.bulb { width: 46px; height: 46px; border-radius: 50%; background: var(--tl-off); transition: background .35s, box-shadow .35s, transform .35s; }
.bulb.lit { transform: scale(1.06); }
.bulb.lit.r { background: var(--tl-red); box-shadow: 0 0 26px var(--tl-red); }
.bulb.lit.a { background: var(--tl-amber); box-shadow: 0 0 26px var(--tl-amber); }
.bulb.lit.g { background: var(--tl-green); box-shadow: 0 0 26px var(--tl-green); }
.verdict { font-size: 28px; font-weight: 800; line-height: 1.1; }
.verdict.r { color: var(--tl-red); } .verdict.a { color: var(--tl-amber); } .verdict.g { color: var(--tl-green); }
.bars { display: grid; gap: 8px; margin-top: 12px; }
.bar { display: grid; grid-template-columns: 110px 1fr 70px; gap: 8px; align-items: center; font-size: 13px; }
.bar .track { height: 8px; border-radius: 99px; background: var(--cp-surface-soft); overflow: hidden; }
.bar .track i { display: block; height: 100%; background: var(--e); border-radius: 99px; transition: width .7s cubic-bezier(.2,.9,.2,1); }
.kw { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.kw span { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--e) 16%, transparent); border: 1px solid var(--e); }
.tips { margin: 10px 0 0; padding-left: 18px; font-size: 13px; }
.tips li { margin: 4px 0; }
.empty { text-align: center; color: var(--cp-text-muted); padding: 30px 10px; }
.foot { margin-top: 16px; font-size: 12px; color: var(--cp-text-soft); text-align: center; }

/* Storyline */
.film { position: fixed; left: 0; right: 0; bottom: 0; height: 132px; z-index: 30; display: flex; flex-direction: column; background: var(--cp-panel-strong); border-top: 1px solid var(--cp-border); }
.film::before { content: ""; height: 3px; flex: none; background: linear-gradient(90deg, var(--ms-red), var(--ms-green), var(--ms-blue), var(--ms-yellow)); opacity: .85; }
.filmrow { flex: 1; display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 0; }
.navbtn { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--cp-border-strong); background: var(--cp-surface); cursor: pointer; font-size: 22px; line-height: 1; display: grid; place-items: center; transition: transform .15s, background .15s; }
.navbtn:hover:not(:disabled) { transform: scale(1.08); background: var(--cp-surface-soft); }
.navbtn:disabled { opacity: .35; cursor: default; }
.reel { flex: 1; min-width: 0; height: 100%; overflow-x: auto; overflow-y: hidden; scroll-behavior: smooth; scrollbar-width: none; }
.reel.scrolls { -webkit-mask-image: linear-gradient(90deg, transparent, #000 28px, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, transparent, #000 28px, #000 calc(100% - 28px), transparent); }
.reel::-webkit-scrollbar { display: none; }
.track { --n: 7; position: relative; height: 100%; min-width: calc(var(--n) * 104px); display: grid; grid-template-columns: repeat(var(--n), 1fr); padding-top: 12px; }
.rail {
  position: absolute; top: calc(12px + 24px); left: calc(50% / var(--n)); right: calc(50% / var(--n)); height: 4px; margin-top: -2px;
}
.rail::before {
  content: ""; position: absolute; inset: 0; border-radius: 99px; opacity: .6;
  background: repeating-linear-gradient(90deg, var(--cp-border-strong) 0 6px, transparent 6px 12px);
  background-size: 24px 100%; animation: railFlow 1.6s linear infinite;
}
.rail i {
  position: absolute; inset: 0; border-radius: 99px;
  background: linear-gradient(90deg, var(--ms-red), var(--ms-yellow) 33%, var(--ms-green) 66%, var(--ms-blue));
  box-shadow: 0 0 10px color-mix(in srgb, var(--ms-blue) 45%, transparent);
  clip-path: inset(-8px calc(100% - var(--p, 0%)) -8px 0 round 99px);
  transition: clip-path .7s cubic-bezier(.2,.9,.2,1);
}
.rail b {
  position: absolute; left: var(--p, 0%); top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
  background: var(--ms-on-blue); box-shadow: 0 0 0 3px var(--ms-blue), 0 0 14px 4px var(--ms-blue);
  transition: left .7s cubic-bezier(.2,.9,.2,1); animation: comet 1.4s ease-in-out infinite;
}
@keyframes railFlow { to { background-position: 24px 0; } }
@keyframes comet { 50% { box-shadow: 0 0 0 3px var(--ms-blue), 0 0 22px 8px var(--ms-blue); } }

.stop {
  --c: var(--ms-brand-blue); position: relative; z-index: 1; border: 0; background: none; padding: 0 4px; cursor: pointer; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--cp-text-muted); text-align: center;
}
.stop .node {
  width: 48px; height: 48px; flex: none; display: grid; place-items: center; position: relative;
}
.stop .dot {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: var(--cp-surface); border: 2px solid var(--cp-border-strong); color: var(--cp-text-soft);
  transition: transform .35s cubic-bezier(.2,1.5,.4,1), background .3s, border-color .3s, color .3s, box-shadow .3s;
}
.stop .dot svg { width: 17px; height: 17px; display: block; }
.stop .dot b { font-size: 14px; font-weight: 800; line-height: 1; }
.stop:hover .dot { transform: translateY(-3px) scale(1.08); border-color: var(--c); color: var(--c); }
.stop.done .dot { background: var(--c); border-color: var(--c); color: var(--ms-on-blue); }
.stop.active .dot {
  transform: scale(1.28); color: var(--ms-on-blue); border-color: transparent;
  background: conic-gradient(from var(--ang), var(--ms-red), var(--ms-yellow), var(--ms-green), var(--ms-blue), var(--ms-red)) border-box;
  animation: spinBorder 4s linear infinite; box-shadow: 0 6px 18px color-mix(in srgb, var(--ms-blue) 45%, transparent);
}
.stop.active .dot > * { filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
.stop.active .node::before, .stop.active .node::after {
  content: ""; position: absolute; inset: 4px; border-radius: 50%; border: 2px solid var(--ms-blue); opacity: 0; animation: ripple 2.2s ease-out infinite;
}
.stop.active .node::after { animation-delay: 1.1s; }
@keyframes ripple { 0% { transform: scale(.9); opacity: .7; } 100% { transform: scale(1.7); opacity: 0; } }
.stop .kick { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--cp-text-soft); line-height: 1; margin-top: 2px; }
.stop .fl { font-size: 12px; font-weight: 600; line-height: 1.2; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .3s; }
.stop.active .kick { color: var(--c); }
.stop.active .fl, .stop:hover .fl { color: var(--cp-text); }
.stop .fv { display: flex; gap: 3px; height: 6px; }
.stop .fv i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); opacity: .55; transition: opacity .3s, transform .3s; }
.stop .fv i.sq { border-radius: 1px; }
.stop.active .fv i { opacity: 1; transform: scale(1.15); }
.stop:focus-visible { outline: none; }
.stop:focus-visible .dot { outline: 2px solid var(--ms-brand-blue); outline-offset: 3px; }
.counter { flex: none; font-weight: 700; font-size: 14px; min-width: 54px; text-align: center; color: var(--cp-text-muted); }

@media (max-width: 1050px) {
  .cards, .gcse { grid-template-columns: 1fr 1fr; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

function analysePrompt(text) {
  const t = String(text || '').trim();
  const words = t ? t.split(/\s+/).length : 0;
  const scores = {}, hits = {};
  for (const k of ['g', 'c', 's', 'e']) {
    let s = 0; const found = [];
    for (const [w, re] of RULES[k]) {
      const m = t.match(re);
      if (m) { s += w; const h = m[0].trim().toLowerCase(); if (k !== 'c' || w !== 0.15) if (h && !found.includes(h) && h.length < 40) found.push(h); }
    }
    scores[k] = Math.min(1, s); hits[k] = found;
  }
  let spec = words < 8 ? 0 : words < 20 ? 0.3 : words < 40 ? 0.6 : words <= 200 ? 1 : 0.8;
  if (/[A-Z]{2,}-?\d+|\d/.test(t)) spec = Math.min(1, spec + 0.2);
  if (!words) spec = 0;
  const sum = scores.g + scores.c + scores.s + scores.e;
  const pct = Math.round(sum / 4 * 80 + spec * 20);
  const present = ['g', 'c', 's', 'e'].filter(k => scores[k] >= 0.5).length;
  let grade;
  if (words < 6) grade = 'poor';
  else if (pct >= 70 && present === 4) grade = 'great';
  else if ((pct >= 30 && present >= 2) || pct >= 45 || (scores.g >= 0.6 && words >= 10)) grade = 'average';
  else grade = 'poor';
  return { grade, pct, scores, hits, present, words };
}

/* ---------- holders: map DOM anchors to 3D actors ---------- */
const factories = { logo: makeLogo, gcse: makeGCSE, bag: makeBag, shield: makeShield, bottle: makeBottle, play: makePlay, tower: makeTower, bulb: makeBulb, traffic: makeTraffic, car: makeCar, portico: makePortico, radar: makeRadar, mortarboard: makeMortarboard, turbine: makeTurbine, coins: makeCoins, health: makeHealth, townhall: makeTownhall, gears: makeGears, heart: makeHeart, briefcase: makeBriefcase, siren: makeSiren, plane: makePlane };
const holders = {};
function holder(k) {
  if (holders[k]) return holders[k];
  if (!factories[k]) return null;
  const a = factories[k](), outer = new THREE.Group(), spin = new THREE.Group();
  outer.add(spin); spin.add(a.obj); outer.visible = false; scene.add(outer);
  return (holders[k] = { a, outer, spin, s: 0, v: 0, target: 0, pos: V(0, 0, 0), has: false, spin0: -99, pending: 0 });
}
const pointer = { x: 0, y: 0, sx: 0, sy: 0 };
addEventListener('pointermove', e => { pointer.x = e.clientX / innerWidth * 2 - 1; pointer.y = -(e.clientY / innerHeight * 2 - 1); }, { passive: true });

function layout() {
  for (const k in holders) holders[k].target = 0;
  const wpp = VIEW_H / innerHeight;
  document.querySelectorAll('#stage .slide.active .anchor[data-actor]').forEach(el => {
    const h = holder(el.dataset.actor); if (!h) return;
    const r = el.getBoundingClientRect(); if (r.width < 4 || r.height < 4) return;
    const nx = (r.left + r.width / 2) / innerWidth * 2 - 1, ny = -((r.top + r.height / 2) / innerHeight * 2 - 1);
    h.pos.set(nx * VIEW_H / 2 * camera.aspect, ny * VIEW_H / 2, 0);
    h.target = Math.min(r.width * wpp / h.a.w, r.height * wpp / h.a.h);
    if (!h.has) { h.outer.position.copy(h.pos); h.has = true; }
  });
}
let T = 0, kick = 0;
function enterActor(k, n = 50) { const h = holder(k); if (!h) return; h.spin0 = T; h.a.enter && h.a.enter(T); h.pending = n; }
document.addEventListener('aop:slide', e => { kick = 1; if (e.detail && e.detail.actor) enterActor(e.detail.actor); });
document.addEventListener('aop:grade', e => {
  const gr = e.detail ? e.detail.grade : null, h = holder('traffic');
  h.a.setGrade(gr, T); if (gr === 'great') h.pending = 160; else if (gr) h.pending = 0;
});
document.querySelectorAll('#stage .slide.active .anchor[data-actor]').forEach(el => enterActor(el.dataset.actor));
(() => { const ta = document.querySelector('#result .result'); if (ta && window.AOP && AOP.state && AOP.state.result) holder('traffic').a.setGrade(AOP.state.result.grade, 0); })();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(innerWidth, innerHeight, false);
  dMat.uniforms.uPR.value = renderer.getPixelRatio();
});
applyTheme();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 30) * TS; T += dt;
  pointer.sx += (pointer.x - pointer.sx) * Math.min(1, dt * 4); pointer.sy += (pointer.y - pointer.sy) * Math.min(1, dt * 4);
  kick *= Math.exp(-dt * 1.5);
  ribbons.forEach(r => { r.material.uniforms.uTime.value = T; r.material.uniforms.uAmp.value = 1 + kick * 1.4; });
  dMat.uniforms.uTime.value = T;
  bg.position.set(-pointer.sx * 0.6, -pointer.sy * 0.35, 0); bg.rotation.z = pointer.sx * 0.02;
  layout();
  for (const k in holders) {
    const h = holders[k];
    h.v += (120 * (h.target - h.s) - 12 * h.v) * dt; h.s += h.v * dt;
    if (h.s < 0) { h.s = 0; h.v = Math.max(0, h.v); }
    h.outer.visible = h.s > 0.01; h.outer.scale.setScalar(h.s);
    h.outer.position.lerp(h.pos, 1 - Math.exp(-12 * dt));
    if (h.pending && h.has && h.target > 0) { burst(h.pos, h.pending, h.pending > 100 ? 7 : 4.5, h.pending > 100 ? 1.2 : 0.8); h.pending = 0; }
    if (!h.outer.visible) continue;
    const sk = clamp01((T - h.spin0) / 1.1);
    h.spin.rotation.y = (sk < 1 ? easeOut(sk) * TAU : 0) + pointer.sx * 0.45 + Math.sin(T * 0.5) * 0.18;
    h.spin.rotation.x = -pointer.sy * 0.3 + Math.sin(T * 0.4) * 0.05;
    h.a.update(T, dt);
  }
  updateConfetti(dt);
  renderer.render(scene, camera);
});
